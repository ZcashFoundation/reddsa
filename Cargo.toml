[package]
name = "reddsa"
edition = "2021"
rust-version = "1.88"
# Refer to DEVELOPERS.md for guidance on making new releases.
version = "0.5.2"
authors = [
    "Henry de Valence <hdevalence@hdevalence.ca>",
    "Deirdre Connolly <durumcrustulum@gmail.com>",
    "Chelsea Komlo <me@chelseakomlo.com>",
    "Jack Grigg <jack@electriccoin.co>",
    "Conrado Gouvea <conradoplg@gmail.com>",
]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZcashFoundation/reddsa"
categories = ["cryptography", "no-std"]
keywords = ["cryptography", "crypto", "zcash"]
description = "A standalone implementation of the RedDSA signature scheme."

[package.metadata.docs.rs]
features = ["nightly"]

[dependencies]
blake2b_simd = { version = "1", default-features = false }
byteorder = { version = "1.5", default-features = false }
group = { version = "0.14", default-features = false }
hex = { version = "0.4", optional = true, default-features = false, features = ["alloc"] }
jubjub = { version = "0.11", default-features = false }
pasta_curves = { version = "0.5", default-features = false }
rand_core = { version = "0.10", default-features = false }
serde = { version = "1", optional = true, features = ["derive"] }
thiserror = { version = "2.0", optional = true }
frost-rerandomized = { version = "3.0.0", optional = true, default-features = false, features = ["serialization"] }

[dependencies.zeroize]
version = "1"
features = ["zeroize_derive"]
optional = true

[dev-dependencies]
bincode = "1"
criterion = "0.8"
hex = "0.4.3"
proptest-derive = "0.5"
lazy_static = "1.5"
proptest = "1.6"
rand = "0.10"
rand_chacha = "0.10"
serde_json = "1.0"
num-bigint = "0.4.6"
num-traits = "0.2.19"
frost-rerandomized = { version = "3.0.0", features = ["test-impl"] }

# `alloc` is only used in test code
[dev-dependencies.pasta_curves]
version = "0.5"
default-features = false
features = ["alloc"]

[patch.crates-io]
frost-rerandomized = { git = "https://github.com/zcashfoundation/frost.git", rev = "0966bd1529aa062ad3b621af99e277f976b1c0f0" }
pasta_curves = { git = "https://github.com/zcash/pasta_curves.git", rev = "9b5e3ca12bef7e08ca195d060abe368cbca85edc" }

[features]
std = ["blake2b_simd/std", "thiserror", "zeroize", "alloc",
       "serde"] # conditional compilation for serde not complete (issue #9)
alloc = ["hex"]
nightly = []
frost = ["frost-rerandomized", "alloc"]
serde = ["dep:serde", "frost-rerandomized?/serde"]
default = ["std"]

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "frost"
harness = false
